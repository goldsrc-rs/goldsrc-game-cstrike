[package]
name = "goldsrc-game-cstrike"
version = "0.20.0"
edition = "2024"
authors = ["GoldSrc.rs Team"]
description = "Counter-Strike 1.6 game domain logic, weapon constants, equipment, and ReGameDLL extensions for GoldSrc.rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goldsrc-rs/goldsrc-game-cstrike"
homepage = "https://github.com/goldsrc-rs/goldsrc-game-cstrike"
readme = "README.md"
keywords = ["goldsrc", "counter-strike", "cstrike", "hlsdk", "regamedll"]
categories = ["game-development", "api-bindings"]

[workspace]
members = [
    ".",
    "examples/demo_plugins/vip_menu",
]
resolver = "3"

[dependencies]
goldsrc-api = { git = "https://github.com/goldsrc-rs/goldsrc-sdk.git", branch = "dev", version = "0.20.0" }

[dev-dependencies]
goldsrc-api = { git = "https://github.com/goldsrc-rs/goldsrc-sdk.git", branch = "dev", version = "0.20.0" }

[patch."https://github.com/goldsrc-rs/goldsrc-sdk.git"]
goldsrc = { path = "../goldsrc-sdk-core/goldsrc" }
goldsrc-api = { path = "../goldsrc-sdk-core/goldsrc-api" }
goldsrc-macros = { path = "../goldsrc-sdk-core/goldsrc-macros" }
goldsrc-sys = { path = "../goldsrc-sdk-core/goldsrc-sys" }
goldsrc-spi = { path = "../goldsrc-sdk-core/goldsrc-spi" }

[patch."https://github.com/ulquiorracode/stitch-rs.git"]
stitch-core = { path = "../../stitch-rs/crates/stitch-core" }
stitch-macros = { path = "../../stitch-rs/crates/stitch-macros" }
stitch-rs = { path = "../../stitch-rs" }


